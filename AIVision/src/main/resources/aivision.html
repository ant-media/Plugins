<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>AI Vision</title>
	<style>
		:root {
			color-scheme: dark;
			font-family: Inter, Arial, Helvetica, sans-serif;
			background: #090d14;
			color: #f5f7fb;
			--ant-red: #e31e24;
			--bg: #090d14;
			--panel: #111827;
			--panel-soft: #141d2b;
			--panel-deep: #0c111d;
			--line: #263348;
			--text: #f5f7fb;
			--muted: #98a2b3;
			--muted-strong: #cbd5e1;
			--danger-soft: rgba(227, 30, 36, 0.16);
			--danger-line: rgba(227, 30, 36, 0.42);
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			overflow-x: hidden;
			background:
				radial-gradient(circle at 18% 0%, rgba(227, 30, 36, 0.18), transparent 32%),
				linear-gradient(180deg, #111827 0%, var(--bg) 42%);
		}

		button,
		input,
		select,
		textarea {
			font: inherit;
		}

		.app {
			display: grid;
			grid-template-rows: auto minmax(0, 1fr);
			gap: 16px;
			width: min(100%, 1600px);
			height: 100vh;
			min-height: 720px;
			margin: 0 auto;
			padding: 16px;
		}

		.topbar,
		.panel,
		.stage,
		.results-panel {
			border: 1px solid var(--line);
			border-radius: 8px;
			background: rgba(17, 24, 39, 0.9);
			box-shadow: 0 18px 42px rgba(0, 0, 0, 0.28);
		}

		.topbar {
			display: grid;
			grid-template-columns: minmax(180px, 1fr) auto minmax(180px, 1fr);
			align-items: center;
			gap: 24px;
			padding: 12px 14px;
		}

		.brand {
			display: flex;
			align-items: center;
			min-width: 0;
		}

		.topbar-title {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 12px;
			min-width: 0;
			text-align: center;
		}

		.brand-logo {
			display: block;
			width: 168px;
			height: auto;
			max-height: 38px;
		}

		.brand-name {
			color: var(--muted-strong);
			font-size: 13px;
			font-weight: 800;
			line-height: 1;
		}

		h1,
		h2 {
			margin: 0;
		}

		h1 {
			font-size: 28px;
			line-height: 1.1;
		}

		.title-divider {
			color: var(--ant-red);
			font-size: 22px;
			font-weight: 900;
		}

		.live-state {
			display: none;
			align-items: center;
			justify-self: end;
			gap: 8px;
			max-width: 420px;
			border: 1px solid var(--line);
			border-radius: 999px;
			background: var(--panel-deep);
			color: var(--muted-strong);
			padding: 8px 12px;
			font-size: 13px;
			font-weight: 800;
		}

		.live-dot {
			width: 9px;
			height: 9px;
			border-radius: 999px;
			background: #667085;
			flex: 0 0 auto;
		}

		.app.alert-active .live-state {
			display: flex;
			border-color: var(--danger-line);
			background: var(--danger-soft);
			color: #fecaca;
			animation: alertPulse 1s ease-in-out infinite;
		}

		.app.alert-active .live-dot {
			background: var(--ant-red);
			box-shadow: 0 0 0 6px rgba(227, 30, 36, 0.15);
		}

		@keyframes alertPulse {
			0%, 100% {
				opacity: 1;
			}
			50% {
				opacity: 0.45;
			}
		}

		.layout {
			display: grid;
			grid-template-columns: minmax(300px, 340px) minmax(460px, 1fr) minmax(360px, 420px);
			gap: 16px;
			align-items: stretch;
			min-height: 0;
			min-width: 0;
		}

		.panel,
		.stage,
		.results-panel {
			display: grid;
			gap: 14px;
			padding: 14px;
			min-height: 0;
			min-width: 0;
		}

		.panel {
			align-content: start;
		}

		.stage {
			grid-template-rows: auto auto auto;
			align-content: start;
			overflow: visible;
		}

		.stage > *, .player-toolbar, .player-shell, .prompt-panel { width: 100%; min-width: 0; }

		.results-panel {
			grid-template-rows: auto minmax(0, 1fr);
			overflow: hidden;
		}

		.panel-title {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 10px;
			color: var(--text);
			font-size: 12px;
			font-weight: 900;
			letter-spacing: 0.04em;
			text-transform: uppercase;
		}

		.counter {
			border: 1px solid var(--line);
			border-radius: 999px;
			background: var(--panel-deep);
			color: var(--muted-strong);
			padding: 4px 8px;
			font-size: 12px;
		}

		.query-heading-actions { display: flex; align-items: center; gap: 7px; min-width: 0; }
		.query-file-name { max-width: 110px; overflow: hidden; color: var(--muted); font-size: 11px; font-weight: 700; text-overflow: ellipsis; text-transform: none; white-space: nowrap; }
		.query-toolbar-button { display: grid; place-items: center; width: 32px; height: 32px; min-height: 32px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-deep); color: var(--muted-strong); padding: 0; }
		.query-toolbar-button:hover { border-color: #64748b; color: #fff; box-shadow: none; transform: none; }
		.query-toolbar-button svg { width: 16px; height: 16px; }

		.form-grid {
			display: grid;
			gap: 28px;
		}

		.field-group {
			display: grid;
			gap: 12px;
			border-top: 1px solid var(--line);
			padding-top: 28px;
		}

		.field-group:first-child {
			border-top: 0;
			padding-top: 0;
		}

		.field-group.is-hidden {
			display: none;
		}

		.group-title {
			color: #e2e8f0;
			font-size: 15px;
			font-weight: 950;
			letter-spacing: 0.04em;
			text-transform: uppercase;
		}

		label {
			display: grid;
			gap: 7px;
			color: var(--muted-strong);
			font-size: 13px;
			font-weight: 800;
		}

		input,
		select,
		textarea {
			width: 100%;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--panel-deep);
			color: var(--text);
			padding: 10px 11px;
			outline: none;
			transition: border-color 0.16s ease, box-shadow 0.16s ease;
		}

		select { min-height: 42px; appearance: auto; }

		input:focus,
		select:focus,
		textarea:focus {
			border-color: rgba(227, 30, 36, 0.7);
			box-shadow: 0 0 0 4px rgba(227, 30, 36, 0.14);
		}

		textarea {
			min-height: 132px;
			resize: vertical;
			line-height: 1.45;
		}

		.actions {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 10px;
		}

		.stream-row {
			display: grid;
			grid-template-columns: minmax(0, 1fr) 138px;
			gap: 10px;
			align-items: end;
		}

		button {
			min-height: 42px;
			border: 1px solid transparent;
			border-radius: 8px;
			background: var(--ant-red);
			color: #ffffff;
			cursor: pointer;
			font-weight: 900;
			padding: 10px 12px;
			transition: transform 0.14s ease, box-shadow 0.14s ease, opacity 0.14s ease;
		}

		button:hover {
			transform: translateY(-1px);
			box-shadow: 0 10px 22px rgba(227, 30, 36, 0.22);
		}

		button.secondary {
			border-color: var(--line);
			background: #1b2536;
			color: var(--text);
		}

		button.secondary:hover {
			box-shadow: 0 10px 22px rgba(0, 0, 0, 0.18);
		}

		.connection-button {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			background: #1b2536;
			border-color: var(--line);
			color: var(--text);
			white-space: nowrap;
		}

		.connection-button.is-connected {
			background: rgba(18, 183, 106, 0.16);
			border-color: rgba(18, 183, 106, 0.45);
			color: #bbf7d0;
		}

		.connection-button.is-connecting {
			background: rgba(227, 30, 36, 0.14);
			border-color: rgba(227, 30, 36, 0.45);
			color: #fecaca;
		}

		.connection-dot {
			width: 9px;
			height: 9px;
			border-radius: 999px;
			background: #64748b;
			flex: 0 0 auto;
		}

		.connection-button.is-connected .connection-dot {
			background: #22c55e;
			box-shadow: 0 0 0 5px rgba(34, 197, 94, 0.14);
		}

		.connection-button.is-connecting .connection-dot {
			background: var(--ant-red);
			box-shadow: 0 0 0 5px rgba(227, 30, 36, 0.14);
		}

		button:disabled {
			cursor: wait;
			opacity: 0.62;
			transform: none;
			box-shadow: none;
		}

		.status {
			min-height: 42px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--panel-deep);
			color: var(--muted-strong);
			padding: 11px;
			font-size: 13px;
			font-weight: 800;
			line-height: 1.35;
			overflow-wrap: anywhere;
		}

		.player-shell {
			position: relative;
			overflow: hidden;
			border: 1px solid #334155;
			border-radius: 8px;
			background: #030712;
			aspect-ratio: 16 / 9;
			min-height: 190px;
			max-height: 360px;
		}

		.player-toolbar {
			display: grid;
			grid-template-columns: minmax(0, 1fr);
			gap: 10px;
			align-items: end;
		}

		.settings-heading { margin-bottom: 12px; font-size: 16px; font-weight: 950; }
		.settings-heading-actions { display: flex; gap: 7px; }
		.settings-heading-button { width: auto; min-height: 32px; padding: 6px 10px; font-size: 12px; }

		.app.alert-active .player-shell {
			border-color: var(--ant-red);
			box-shadow: 0 0 0 4px rgba(227, 30, 36, 0.15);
		}

		video {
			display: block;
			width: 100%;
			height: 100%;
			background: #030712;
			object-fit: contain;
		}

		.stream-badge {
			position: absolute;
			left: 12px;
			top: 12px;
			border: 1px solid rgba(255, 255, 255, 0.14);
			border-radius: 999px;
			background: rgba(3, 7, 18, 0.78);
			color: #ffffff;
			padding: 7px 10px;
			font-size: 12px;
			font-weight: 900;
		}

		.prompt-panel {
			display: grid;
			gap: 12px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--panel-soft);
			padding: 14px;
		}

		.queries-panel {
			display: grid;
			gap: 10px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--panel-soft);
			padding: 14px;
		}

		.queries-list {
			display: grid;
			gap: 12px;
			align-content: start;
			overflow: auto;
		}

		.query-item {
			display: grid;
			gap: 14px;
			border: 1px solid var(--line);
			border-radius: 12px;
			background: linear-gradient(145deg, #111827 0%, #0b1220 100%);
			padding: 14px;
			box-shadow: 0 10px 24px rgba(2, 6, 23, 0.2);
		}

		.query-head {
			display: flex;
			align-items: start;
			justify-content: space-between;
			gap: 10px;
		}

		.query-actions {
			display: flex;
			gap: 6px;
			flex: 0 0 auto;
		}

		.query-stats {
			display: flex;
			align-items: center;
			gap: 7px;
			flex-wrap: wrap;
			color: var(--muted-strong);
			font-size: 12px;
			font-weight: 800;
		}

		.query-stat {
			min-height: 28px;
			border: 1px solid var(--line);
			border-radius: 999px;
			background: rgba(15, 23, 42, 0.7);
			padding: 5px 9px;
			color: var(--muted-strong);
			font-size: 12px;
			font-weight: 800;
			cursor: pointer;
			transition: border-color 0.16s ease, background 0.16s ease;
		}

		.query-stat:hover { border-color: #64748b; background: #1e293b; box-shadow: none; transform: none; }

		.query-stat.alerts {
			border-color: var(--danger-line);
			color: #fca5a5;
		}

		.query-latest-toggle { display: flex; align-items: center; gap: 7px; min-height: 28px; margin-left: auto; color: var(--muted-strong); font-size: 11px; font-weight: 800; cursor: pointer; white-space: nowrap; }
		.query-latest-toggle .switch-track { width: 34px; height: 20px; }
		.query-latest-toggle .switch-track::after { width: 14px; height: 14px; }
		.query-latest-toggle input:checked + .switch-track::after { transform: translateX(14px); }

		.modal-results-list { display: grid; grid-column: 1 / -1; gap: 10px; }

		.query-last-result {
			display: grid;
			grid-template-columns: 88px minmax(0, 1fr);
			gap: 11px;
			border: 1px solid var(--line);
			border-radius: 10px;
			background: rgba(2, 6, 23, 0.48);
			padding: 9px;
			color: var(--muted-strong);
			font-size: 12px;
			line-height: 1.4;
			cursor: pointer;
			transition: border-color 0.16s ease, background 0.16s ease;
		}

		.query-last-result:hover { border-color: #475569; background: rgba(15, 23, 42, 0.8); }
		.query-last-result[hidden] { display: none; }
		.query-last-result.is-empty { display: block; cursor: default; padding: 14px; text-align: center; }
		.query-last-result.is-alert { border-color: var(--danger-line); background: var(--danger-soft); }
		.query-result-thumb { width: 88px; aspect-ratio: 16 / 10; border: 1px solid var(--line); border-radius: 7px; background: #020617; object-fit: cover; }
		.query-result-body { display: grid; gap: 5px; min-width: 0; }
		.query-result-meta { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 11px; font-weight: 800; }
		.query-result-text { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; color: var(--muted-strong); font-size: 12px; line-height: 1.45; }

		.query-info {
			display: grid;
			gap: 4px;
			min-width: 0;
		}

		.query-title {
			color: var(--text);
			font-size: 14px;
			font-weight: 900;
			line-height: 1.4;
			overflow-wrap: anywhere;
		}

		.query-prompt {
			overflow: hidden;
			color: var(--muted);
			font-size: 12px;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.query-icon-button { display: grid; place-items: center; width: 32px; height: 32px; min-height: 32px; border-color: var(--line); border-radius: 8px; background: rgba(15, 23, 42, 0.75); color: var(--muted-strong); padding: 0; }
		.query-icon-button:hover { border-color: #64748b; color: #fff; box-shadow: none; transform: none; }
		.query-icon-button.delete:hover { border-color: var(--danger-line); background: var(--danger-soft); color: #fca5a5; }
		.query-icon-button svg { width: 16px; height: 16px; }

		.analysis-actions {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
			align-items: center;
		}

		.analysis-actions > #analyzeButton { flex: 0 0 108px; }
		.analysis-actions > .apply-field { flex: 1 1 210px; margin-right: 14px; }
		.analysis-actions > .continuous-field { flex: 0 0 122px; }
		.analysis-actions > .period-control { flex: 0 0 150px; }

		.action-field, .period-control { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 8px; min-width: 0; }
		.control-label { color: var(--muted-strong); font-size: 12px; font-weight: 800; white-space: nowrap; }

		.apply-to {
			position: relative;
			min-width: 0;
		}

		.apply-to summary {
			min-height: 42px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--panel-deep);
			color: var(--text);
			cursor: pointer;
			font-size: 13px;
			font-weight: 900;
			padding: 11px;
			list-style: none;
		}

		.apply-to-options {
			position: absolute;
			z-index: 20;
			top: calc(100% + 6px);
			right: 0;
			display: grid;
			width: min(320px, 80vw);
			max-height: 240px;
			overflow: auto;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: #111827;
			padding: 8px;
			box-shadow: 0 18px 42px rgba(0, 0, 0, 0.4);
		}

		.apply-to-options label {
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 7px;
		}

		.apply-to-options input {
			width: auto;
		}

		.period-control {
			color: var(--muted-strong);
		}

		.period-control input {
			width: 100%;
		}

		.period-control.is-disabled {
			opacity: 0.45;
		}

		.switch-control {
			display: flex;
			align-items: center;
			justify-content: flex-start;
			min-height: 42px;
			padding: 0;
			cursor: pointer;
			user-select: none;
		}

		.switch-label {
			font-size: 13px;
			font-weight: 900;
		}

		.switch-control input {
			position: absolute;
			opacity: 0;
			pointer-events: none;
		}

		.switch-track {
			position: relative;
			width: 42px;
			height: 24px;
			border-radius: 999px;
			background: #334155;
			flex: 0 0 auto;
			transition: background 0.16s ease;
		}

		.switch-track::after {
			content: "";
			position: absolute;
			left: 3px;
			top: 3px;
			width: 18px;
			height: 18px;
			border-radius: 999px;
			background: #ffffff;
			transition: transform 0.16s ease;
		}

		.switch-control input:checked + .switch-track {
			background: var(--ant-red);
		}

		.switch-control input:checked + .switch-track::after {
			transform: translateX(18px);
		}

		.results-list {
			display: grid;
			gap: 10px;
			align-content: start;
			min-height: 0;
			overflow: auto;
			padding-right: 2px;
		}

		.empty-results {
			border: 1px dashed #334155;
			border-radius: 8px;
			background: var(--panel-deep);
			color: var(--muted);
			padding: 22px 14px;
			font-size: 13px;
			text-align: center;
		}

		.result-item {
			display: grid;
			grid-template-columns: 92px minmax(0, 1fr);
			gap: 12px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--panel-soft);
			padding: 12px;
			cursor: pointer;
			text-align: left;
			transition: border-color 0.16s ease, transform 0.16s ease, background 0.16s ease;
		}

		.result-item:hover,
		.result-item:focus-visible {
			border-color: #475569;
			background: #182235;
			transform: translateY(-1px);
			outline: none;
		}

		.result-item.is-alert {
			border-color: var(--danger-line);
			background: var(--danger-soft);
		}

		.result-thumb {
			width: 92px;
			aspect-ratio: 16 / 10;
			border: 1px solid var(--line);
			border-radius: 6px;
			background: #020617;
			object-fit: cover;
		}

		.result-placeholder {
			display: grid;
			place-items: center;
			color: var(--muted);
			font-size: 11px;
		}

		.result-body {
			display: grid;
			gap: 6px;
			min-width: 0;
		}

		.result-head {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 8px;
			min-width: 0;
		}

		.result-title {
			display: flex;
			align-items: center;
			gap: 7px;
			min-width: 0;
			color: var(--text);
			font-size: 13px;
			font-weight: 900;
		}

		.result-title span {
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.result-time {
			color: var(--muted);
			font-size: 12px;
			font-weight: 800;
			white-space: nowrap;
		}

		.result-text {
			display: -webkit-box;
			-webkit-box-orient: vertical;
			-webkit-line-clamp: 4;
			overflow: hidden;
			color: var(--muted-strong);
			font-size: 13px;
			line-height: 1.45;
			overflow-wrap: anywhere;
		}

		.bell-icon {
			width: 16px;
			height: 16px;
			color: #fca5a5;
			flex: 0 0 auto;
		}

		.modal-backdrop {
			position: fixed;
			inset: 0;
			z-index: 50;
			display: none;
			align-items: center;
			justify-content: center;
			background: rgba(2, 6, 23, 0.78);
			padding: 22px;
		}

		.modal-backdrop.is-open {
			display: flex;
		}

		.result-modal {
			display: grid;
			grid-template-rows: auto minmax(0, 1fr);
			width: min(920px, 100%);
			max-height: min(760px, calc(100vh - 44px));
			border: 1px solid var(--line);
			border-radius: 8px;
			background: #0f172a;
			box-shadow: 0 30px 90px rgba(0, 0, 0, 0.46);
			overflow: hidden;
		}

		.modal-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			border-bottom: 1px solid var(--line);
			padding: 14px 16px;
		}

		.modal-title {
			display: flex;
			align-items: center;
			gap: 8px;
			min-width: 0;
			color: var(--text);
			font-size: 16px;
			font-weight: 900;
		}

		.modal-close {
			display: grid;
			place-items: center;
			width: 34px;
			height: 34px;
			min-height: 34px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: #111827;
			color: var(--muted-strong);
			padding: 0;
		}

		.modal-close:hover {
			box-shadow: none;
		}

		.modal-content {
			display: grid;
			grid-template-columns: minmax(260px, 42%) minmax(0, 1fr);
			gap: 16px;
			min-height: 0;
			overflow: auto;
			padding: 16px;
		}

		.modal-image {
			width: 100%;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: #020617;
			object-fit: contain;
		}

		.modal-placeholder {
			display: grid;
			place-items: center;
			min-height: 180px;
			border: 1px dashed #334155;
			border-radius: 8px;
			background: #020617;
			color: var(--muted);
			font-size: 13px;
		}

		.detail-stack {
			display: grid;
			gap: 12px;
			align-content: start;
		}

		.detail-block {
			display: grid;
			gap: 7px;
		}

		.detail-label {
			color: var(--muted);
			font-size: 11px;
			font-weight: 900;
			letter-spacing: 0.05em;
			text-transform: uppercase;
		}

		.detail-value {
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--panel-deep);
			color: var(--muted-strong);
			padding: 10px;
			font-size: 13px;
			line-height: 1.5;
			white-space: pre-wrap;
			overflow-wrap: anywhere;
		}

		.detail-value.primary {
			color: var(--text);
			font-size: 14px;
		}

		@media (max-width: 1220px) {
			.app {
				height: auto;
				min-height: 100vh;
			}

			.layout {
				grid-template-columns: minmax(280px, 330px) minmax(420px, 1fr);
			}

			.results-panel {
				grid-column: 1 / -1;
				min-height: 420px;
			}
		}

		@media (max-width: 820px) {
			.layout {
				grid-template-columns: 1fr;
			}

			.panel {
				min-height: auto;
			}
		}

		@media (max-width: 640px) {
			.app {
				padding: 12px;
			}

			.topbar {
				align-items: flex-start;
				grid-template-columns: 1fr;
			}

			.brand {
				align-items: flex-start;
				flex-direction: column;
				gap: 8px;
			}

			.topbar-title {
				align-items: flex-start;
				justify-content: flex-start;
				text-align: left;
			}

			.live-state {
				width: 100%;
				max-width: none;
			}

			.actions {
				grid-template-columns: 1fr;
			}

			.stream-row {
				grid-template-columns: 1fr;
			}

			.analysis-actions { display: grid; grid-template-columns: 1fr; }
			.analysis-actions > #analyzeButton,
			.analysis-actions > .apply-field,
			.analysis-actions > .continuous-field,
			.analysis-actions > .period-control { width: 100%; margin-right: 0; }

			.player-shell {
				min-height: 210px;
			}

			.modal-content {
				grid-template-columns: 1fr;
			}
		}
	</style>
</head>
<body>
	<main id="app" class="app">
		<header class="topbar">
			<div class="brand">
				<img class="brand-logo" src="https://antmedia.io/wp-content/uploads/2020/01/Ant-Media-Logo-light.svg" alt="Ant Media">
			</div>
			<div class="topbar-title">
				<h1>AI Vision</h1>
				<span class="title-divider">-</span>
				<div class="brand-name">Live Stream AI Analysis</div>
			</div>
			<div id="statusPill" class="live-state">
				<span class="live-dot"></span>
				<span id="statusText">Idle</span>
			</div>
		</header>

		<div class="layout">
			<aside class="panel">
				<div class="panel-title settings-heading">
					<span>Settings</span>
					<div class="settings-heading-actions">
						<button id="resetSettingsButton" class="secondary settings-heading-button" type="button">Reset</button>
						<button id="saveSettingsButton" class="settings-heading-button" type="button">Save</button>
					</div>
				</div>
				<div class="form-grid">
					<div class="field-group">
						<div class="group-title">Vision Model</div>
						<label>
							Base URL
							<input id="baseUrl" value="http://localhost:11434/v1" autocomplete="off">
						</label>

						<label>
							Token
							<input id="token" type="password" autocomplete="off">
						</label>

						<label>
							Model
							<input id="model" value="llava" autocomplete="off">
						</label>

					</div>

					<div class="field-group">
						<div class="group-title">Plugin Behavior</div>
						<label>
							Max results per analysis
							<input id="maxResultsPerAnalysis" type="number" min="1" max="1000" value="100">
						</label>

						<label>
							Alert Webhook URL
							<input id="webhookUrl" type="url" placeholder="https://example.com/alerts" autocomplete="off">
						</label>

					</div>

					<div class="field-group">
						<div class="group-title">Status</div>
						<div id="status" class="status">Idle</div>
					</div>
				</div>
			</aside>

			<section class="stage">
				<div class="player-toolbar">
					<label>
						Playing Stream
						<select id="activeStreamSelect">
							<option value="">No active stream</option>
						</select>
					</label>
				</div>
				<div class="player-shell">
					<video id="remoteVideo" autoplay playsinline controls muted></video>
					<div id="streamBadge" class="stream-badge">stream1</div>
				</div>

				<section class="prompt-panel">
					<label>
						Prompt
						<textarea id="prompt">Is there a person in this live stream frame?</textarea>
					</label>
					<div class="analysis-actions">
						<button id="analyzeButton" type="button">Analyze</button>
						<div class="action-field apply-field">
							<span class="control-label">Apply to</span>
							<details id="applyTo" class="apply-to">
								<summary id="applyToLabel">All</summary>
								<div id="applyToOptions" class="apply-to-options"></div>
							</details>
						</div>
						<div class="action-field continuous-field">
							<span class="control-label">Continuous</span>
							<label class="switch-control" aria-label="Continuous analysis">
								<input id="continuousToggle" type="checkbox">
								<span class="switch-track"></span>
							</label>
						</div>
						<label id="periodControl" class="period-control is-disabled"><span class="control-label">Period (sec)</span><input id="period" type="number" min="1" max="86400" value="10" disabled></label>
					</div>
				</section>

			</section>

			<aside class="results-panel">
				<div class="panel-title">
					<span>Prompt Queries</span>
					<div class="query-heading-actions">
						<span id="queryCount" class="counter">0</span>
						<span id="queryFileName" class="query-file-name" title="No file selected">No file</span>
						<button id="saveQueriesButton" class="query-toolbar-button" type="button" title="Save queries" aria-label="Save queries">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v3h16v-3"/></svg>
						</button>
						<button id="loadQueriesButton" class="query-toolbar-button" type="button" title="Load queries" aria-label="Load queries">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9m0 0 4 4m-4-4-4 4"/><path d="M4 7V4h16v3"/></svg>
						</button>
						<input id="queryFileInput" type="file" accept="application/json,.json" hidden>
					</div>
				</div>
				<div id="queriesList" class="queries-list">
					<div class="empty-results">No active periodic query.</div>
				</div>
			</aside>
		</div>
	</main>

	<div id="resultModalBackdrop" class="modal-backdrop" aria-hidden="true">
		<section class="result-modal" role="dialog" aria-modal="true" aria-labelledby="resultModalTitle">
			<header class="modal-header">
				<div id="resultModalTitle" class="modal-title"></div>
				<button id="resultModalClose" class="modal-close" type="button" aria-label="Close">x</button>
			</header>
			<div id="resultModalContent" class="modal-content"></div>
		</section>
	</div>

	<script type="module">
		import {WebRTCAdaptor} from "./js/webrtc_adaptor.js";

		const appName = location.pathname.split("/").filter(Boolean)[0] || "LiveApp";
		const restBase = `${location.origin}/${appName}/rest/v2/aivision`;
		const broadcastsBase = `${location.origin}/${appName}/rest/v2/broadcasts`;
		let webRTCAdaptor;
		let resultPollTimer;
		let isAnalyzing = false;
		let lastAnalyzedImageUrl = "";
		let lastAnalyzedFrameTimestamp = 0;
		let connectionState = "disconnected";
		let connectedStreamId = "";
		const periodicResultIds = new Map();
		let activeStreams = [];
		let selectedApplyStreams = new Set();
		const latestVisibleQueryIds = new Set();
		let editingRequestId = null;
		let streamListTimer;
		let queryListTimer;

		const elements = {
			app: document.getElementById("app"),
			prompt: document.getElementById("prompt"),
			period: document.getElementById("period"),
			periodControl: document.getElementById("periodControl"),
			baseUrl: document.getElementById("baseUrl"),
			token: document.getElementById("token"),
			model: document.getElementById("model"),
			webhookUrl: document.getElementById("webhookUrl"),
			maxResultsPerAnalysis: document.getElementById("maxResultsPerAnalysis"),
			applyTo: document.getElementById("applyTo"),
			applyToLabel: document.getElementById("applyToLabel"),
			applyToOptions: document.getElementById("applyToOptions"),
			activeStreamSelect: document.getElementById("activeStreamSelect"),
			queriesList: document.getElementById("queriesList"),
			queryCount: document.getElementById("queryCount"),
			queryFileName: document.getElementById("queryFileName"),
			saveQueriesButton: document.getElementById("saveQueriesButton"),
			loadQueriesButton: document.getElementById("loadQueriesButton"),
			queryFileInput: document.getElementById("queryFileInput"),
			status: document.getElementById("status"),
			statusText: document.getElementById("statusText"),
			resultModalBackdrop: document.getElementById("resultModalBackdrop"),
			resultModalTitle: document.getElementById("resultModalTitle"),
			resultModalContent: document.getElementById("resultModalContent"),
			resultModalClose: document.getElementById("resultModalClose"),
			streamBadge: document.getElementById("streamBadge"),
			analyzeButton: document.getElementById("analyzeButton"),
			continuousToggle: document.getElementById("continuousToggle"),
			resetSettingsButton: document.getElementById("resetSettingsButton"),
			saveSettingsButton: document.getElementById("saveSettingsButton")
		};

		function setStatus(message) {
			elements.status.textContent = message;
		}

		function streamId() {
			return elements.activeStreamSelect.value;
		}

		function updateStreamBadge() {
			elements.streamBadge.textContent = streamId() || "No stream";
			lastAnalyzedImageUrl = "";
			lastAnalyzedFrameTimestamp = 0;
		}

		function updateContinuousMode() {
			const enabled = elements.continuousToggle.checked;
			elements.period.disabled = !enabled;
			elements.periodControl.classList.toggle("is-disabled", !enabled);
		}

		function setConnectionState(state) {
			connectionState = state;
		}

		function bellIcon() {
			const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
			svg.setAttribute("class", "bell-icon");
			svg.setAttribute("viewBox", "0 0 24 24");
			svg.setAttribute("fill", "none");
			svg.setAttribute("stroke", "currentColor");
			svg.setAttribute("stroke-width", "2");
			svg.setAttribute("stroke-linecap", "round");
			svg.setAttribute("stroke-linejoin", "round");

			const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
			path.setAttribute("d", "M10.268 21a2 2 0 0 0 3.464 0");
			const path2 = document.createElementNS("http://www.w3.org/2000/svg", "path");
			path2.setAttribute("d", "M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8a6 6 0 0 0-12 0c0 4.499-1.411 5.956-2.738 7.326");
			svg.append(path, path2);
			return svg;
		}

		function actionIcon(type) {
			const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
			svg.setAttribute("viewBox", "0 0 24 24");
			svg.setAttribute("fill", "none");
			svg.setAttribute("stroke", "currentColor");
			svg.setAttribute("stroke-width", "2");
			svg.setAttribute("stroke-linecap", "round");
			svg.setAttribute("stroke-linejoin", "round");
			const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
			path.setAttribute("d", type === "edit"
					? "M12 20h9 M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"
					: "M18 6 6 18 M6 6l12 12");
			svg.appendChild(path);
			return svg;
		}

		function detailBlock(label, value, primary = false) {
			const block = document.createElement("div");
			block.className = "detail-block";

			const title = document.createElement("div");
			title.className = "detail-label";
			title.textContent = label;

			const content = document.createElement("div");
			content.className = `detail-value${primary ? " primary" : ""}`;
			content.textContent = value || "-";

			block.append(title, content);
			return block;
		}

		let resultModalBackAction = null;

		function closeResultModal() {
			if (resultModalBackAction) {
				const backAction = resultModalBackAction;
				resultModalBackAction = null;
				backAction();
				return;
			}
			elements.resultModalBackdrop.classList.remove("is-open");
			elements.resultModalBackdrop.setAttribute("aria-hidden", "true");
			elements.resultModalTitle.textContent = "";
			elements.resultModalContent.textContent = "";
		}

		function openResultModal(result, backAction = null) {
			resultModalBackAction = backAction;
			elements.resultModalTitle.textContent = "";
			if (result.alertTriggered) {
				elements.resultModalTitle.appendChild(bellIcon());
			}
			const titleText = document.createElement("span");
			titleText.textContent = result.alertTriggered ? "Alert Analysis Detail" : "Analysis Detail";
			elements.resultModalTitle.appendChild(titleText);

			elements.resultModalContent.textContent = "";
			if (result.imageUrl) {
				const image = document.createElement("img");
				image.className = "modal-image";
				image.src = result.imageUrl;
				image.alt = "Analyzed frame";
				elements.resultModalContent.appendChild(image);
			}
			else {
				const placeholder = document.createElement("div");
				placeholder.className = "modal-placeholder";
				placeholder.textContent = "No image";
				elements.resultModalContent.appendChild(placeholder);
			}

			const details = document.createElement("div");
			details.className = "detail-stack";
			details.append(
				detailBlock("Stream", result.streamId),
				detailBlock("Time", result.time),
				detailBlock("Prompt", result.prompt),
				detailBlock("Alert", result.alertTriggered ? (result.alerts.join(", ") || "Triggered") : "No alert"),
				detailBlock("Response", result.aiResponse || result.message || "", true)
			);
			elements.resultModalContent.appendChild(details);
			elements.resultModalBackdrop.classList.add("is-open");
			elements.resultModalBackdrop.setAttribute("aria-hidden", "false");
			elements.resultModalClose.focus();
		}

		function openOneShotResults(results) {
			if (results.length === 1) {
				openResultModal(results[0]);
				return;
			}

			resultModalBackAction = null;
			elements.resultModalTitle.textContent = `Analysis Results (${results.length})`;
			elements.resultModalContent.textContent = "";
			const list = document.createElement("div");
			list.className = "modal-results-list";
			for (const result of results) {
				const item = document.createElement("article");
				item.className = `result-item${result.alertTriggered ? " is-alert" : ""}`;
				item.setAttribute("role", "button");
				item.setAttribute("tabindex", "0");

				let thumbnail;
				if (result.imageUrl) {
					thumbnail = document.createElement("img");
					thumbnail.className = "result-thumb";
					thumbnail.src = result.imageUrl;
					thumbnail.alt = "Analyzed frame";
				}
				else {
					thumbnail = document.createElement("div");
					thumbnail.className = "result-thumb result-placeholder";
					thumbnail.textContent = "No image";
				}

				const body = document.createElement("div");
				body.className = "result-body";
				const head = document.createElement("div");
				head.className = "result-head";
				const title = document.createElement("div");
				title.className = "result-title";
				if (result.alertTriggered) title.appendChild(bellIcon());
				const titleText = document.createElement("span");
				titleText.textContent = result.streamId || "Unknown stream";
				title.appendChild(titleText);
				const time = document.createElement("div");
				time.className = "result-time";
				time.textContent = result.time;
				const responseText = document.createElement("div");
				responseText.className = "result-text";
				responseText.textContent = result.aiResponse || result.message || "";
				head.append(title, time);
				body.append(head, responseText);
				item.append(thumbnail, body);

				const openDetail = () => openResultModal(result, () => openOneShotResults(results));
				item.addEventListener("click", openDetail);
				item.addEventListener("keydown", (event) => {
					if (event.key === "Enter" || event.key === " ") {
						event.preventDefault();
						openDetail();
					}
				});
				list.appendChild(item);
			}
			elements.resultModalContent.appendChild(list);
			elements.resultModalBackdrop.classList.add("is-open");
			elements.resultModalBackdrop.setAttribute("aria-hidden", "false");
			elements.resultModalClose.focus();
		}

		function addResult(body) {
			const result = {
				streamId: body.streamId || streamId(),
				prompt: body.prompt || elements.prompt.value,
				imageUrl: body.imageUrl,
				aiResponse: body.aiResponse,
				message: body.message,
				alertTriggered: Boolean(body.alertTriggered),
				alerts: Array.isArray(body.alerts) ? body.alerts : [],
				time: new Date(body.analysisTimestamp || Date.now()).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })
			};
			elements.app.classList.toggle("alert-active", result.alertTriggered);
			elements.statusText.textContent = result.alertTriggered ? "Alert" : "";
			return result;
		}

		async function request(path, options = {}) {
			const response = await fetch(`${restBase}${path}`, {
				headers: { "Content-Type": "application/json", ...(options.headers || {}) },
				...options
			});
			const text = await response.text();
			const body = text ? JSON.parse(text) : {};
			if (!response.ok) {
				throw new Error(body.message || text || `HTTP ${response.status}`);
			}
			return body;
		}

		async function openQueryResults(group, alertsOnly) {
			try {
				resultModalBackAction = null;
				const allResults = await request(`/periodic/${encodeURIComponent(group.requestId)}/results?after=0`);
				const visibleResults = alertsOnly ? allResults.filter((result) => result.alertTriggered) : allResults;
				elements.resultModalTitle.textContent = alertsOnly ? "Alert Results" : "Analysis Results";
				elements.resultModalContent.textContent = "";
				const list = document.createElement("div");
				list.className = "modal-results-list";
				if (visibleResults.length === 0) {
					list.innerHTML = `<div class="empty-results">No ${alertsOnly ? "alert" : "analysis"} result yet.</div>`;
				}
				for (const rawResult of [...visibleResults].reverse()) {
					const result = { ...rawResult, time: new Date(rawResult.analysisTimestamp || Date.now()).toLocaleTimeString() };
					const item = document.createElement("article");
					item.className = `result-item${result.alertTriggered ? " is-alert" : ""}`;
					item.setAttribute("role", "button");
					item.setAttribute("tabindex", "0");
					let thumbnail;
					if (result.imageUrl) {
						thumbnail = document.createElement("img");
						thumbnail.className = "result-thumb";
						thumbnail.src = result.imageUrl;
						thumbnail.alt = "Analyzed frame";
					}
					else {
						thumbnail = document.createElement("div");
						thumbnail.className = "result-thumb result-placeholder";
						thumbnail.textContent = "No image";
					}
					const body = document.createElement("div");
					body.className = "result-body";
					const head = document.createElement("div");
					head.className = "result-head";
					const title = document.createElement("div");
					title.className = "result-title";
					if (result.alertTriggered) title.appendChild(bellIcon());
					const titleText = document.createElement("span");
					titleText.textContent = result.streamId || "Unknown stream";
					title.appendChild(titleText);
					const time = document.createElement("div");
					time.className = "result-time";
					time.textContent = result.time;
					const responseText = document.createElement("div");
					responseText.className = "result-text";
					responseText.textContent = result.aiResponse || result.message || "";
					head.append(title, time);
					body.append(head, responseText);
					item.append(thumbnail, body);
					const openDetail = () => openResultModal(result, () => openQueryResults(group, alertsOnly));
					item.addEventListener("click", openDetail);
					item.addEventListener("keydown", (event) => {
						if (event.key === "Enter" || event.key === " ") {
							event.preventDefault();
							openDetail();
						}
					});
					list.appendChild(item);
				}
				elements.resultModalContent.appendChild(list);
				elements.resultModalBackdrop.classList.add("is-open");
				elements.resultModalBackdrop.setAttribute("aria-hidden", "false");
			}
			catch (error) {
				setStatus(error.message);
			}
		}

		async function loadActiveQueries() {
			try {
				const queries = await request("/periodic");
				const groups = new Map();
				for (const query of queries) {
					const key = query.requestId;
					const group = groups.get(key) || { requestId: query.requestId, prompt: query.prompt, period: query.period, streams: [], applyToAll: Boolean(query.applyToAll), resultCount: 0, alertCount: 0, lastResult: null };
					group.streams.push(...(query.streamIds || []));
					group.resultCount += query.resultCount || 0;
					group.alertCount += query.alertCount || 0;
					if (query.lastResult && (!group.lastResult || query.lastResult.analysisTimestamp > group.lastResult.analysisTimestamp)) {
						group.lastResult = query.lastResult;
					}
					groups.set(key, group);
				}
				elements.queryCount.textContent = String(groups.size);
				elements.queriesList.textContent = "";
				if (groups.size === 0) {
					const empty = document.createElement("div");
					empty.className = "empty-results";
					empty.textContent = "No active periodic query.";
					elements.queriesList.appendChild(empty);
					return;
				}

				for (const group of groups.values()) {
					const item = document.createElement("div");
					item.className = "query-item";
					const head = document.createElement("div");
					head.className = "query-head";
					const info = document.createElement("div");
					info.className = "query-info";
					const title = document.createElement("div");
					title.className = "query-title";
					title.textContent = group.prompt;
					const prompt = document.createElement("div");
					prompt.className = "query-prompt";
					prompt.textContent = `${group.applyToAll ? "All streams" : group.streams.join(", ")} · every ${group.period}s`;
					info.append(title, prompt);

					const actions = document.createElement("div");
					actions.className = "query-actions";
					const edit = document.createElement("button");
					edit.type = "button";
					edit.className = "query-icon-button";
					edit.title = "Edit query";
					edit.setAttribute("aria-label", "Edit query");
					edit.appendChild(actionIcon("edit"));
					edit.addEventListener("click", () => editQuery(group));
					const remove = document.createElement("button");
					remove.type = "button";
					remove.className = "query-icon-button delete";
					remove.title = "Delete query";
					remove.setAttribute("aria-label", "Delete query");
					remove.appendChild(actionIcon("delete"));
					remove.addEventListener("click", () => deleteQueryGroup(group.requestId));
					actions.append(edit, remove);
					head.append(info, actions);

					const stats = document.createElement("div");
					stats.className = "query-stats";
					const resultStat = document.createElement("button");
					resultStat.type = "button";
					resultStat.className = "query-stat";
					resultStat.textContent = `${group.resultCount} results`;
					resultStat.addEventListener("click", () => openQueryResults(group, false));
					const alertStat = document.createElement("button");
					alertStat.type = "button";
					alertStat.className = "query-stat alerts";
					alertStat.textContent = `${group.alertCount} alerts`;
					alertStat.addEventListener("click", () => openQueryResults(group, true));
					const last = document.createElement("div");
					last.hidden = !latestVisibleQueryIds.has(group.requestId);
					const latestToggle = document.createElement("label");
					latestToggle.className = "query-latest-toggle switch-control";
					const latestText = document.createElement("span");
					latestText.textContent = "Show latest";
					const latestInput = document.createElement("input");
					latestInput.type = "checkbox";
					latestInput.checked = latestVisibleQueryIds.has(group.requestId);
					latestInput.setAttribute("aria-label", "Show latest result");
					const latestTrack = document.createElement("span");
					latestTrack.className = "switch-track";
					latestInput.addEventListener("change", () => {
						if (latestInput.checked) {
							latestVisibleQueryIds.add(group.requestId);
						}
						else {
							latestVisibleQueryIds.delete(group.requestId);
						}
						last.hidden = !latestInput.checked;
					});
					latestToggle.append(latestText, latestInput, latestTrack);
					stats.append(resultStat, alertStat, latestToggle);
					if (group.lastResult) {
						const result = { ...group.lastResult, time: new Date(group.lastResult.analysisTimestamp).toLocaleTimeString() };
						last.className = `query-last-result${result.alertTriggered ? " is-alert" : ""}`;
						let thumbnail;
						if (result.imageUrl) {
							thumbnail = document.createElement("img");
							thumbnail.className = "query-result-thumb";
							thumbnail.src = result.imageUrl;
							thumbnail.alt = "Latest analyzed frame";
						}
						else {
							thumbnail = document.createElement("div");
							thumbnail.className = "query-result-thumb result-placeholder";
							thumbnail.textContent = "No image";
						}
						const resultBody = document.createElement("div");
						resultBody.className = "query-result-body";
						const resultMeta = document.createElement("div");
						resultMeta.className = "query-result-meta";
						const latestLabel = document.createElement("span");
						latestLabel.textContent = result.alertTriggered ? "Latest alert" : "Latest result";
						const streamAndTime = document.createElement("span");
						streamAndTime.textContent = `${result.streamId} · ${result.time}`;
						resultMeta.append(latestLabel, streamAndTime);
						const resultText = document.createElement("div");
						resultText.className = "query-result-text";
						resultText.textContent = result.aiResponse || result.message || "";
						resultBody.append(resultMeta, resultText);
						last.append(thumbnail, resultBody);
						last.setAttribute("role", "button");
						last.setAttribute("tabindex", "0");
						last.addEventListener("click", () => openResultModal(result));
						last.addEventListener("keydown", (event) => {
							if (event.key === "Enter" || event.key === " ") {
								event.preventDefault();
								openResultModal(result);
							}
						});
					}
					else {
						last.className = "query-last-result is-empty";
						last.textContent = "Waiting for the first result…";
					}
					item.append(head, stats, last);
					elements.queriesList.appendChild(item);
				}
			}
			catch (error) {
				setStatus(error.message);
			}
		}

		async function saveQueries() {
			try {
				const queries = await request("/periodic");
				const fileContent = {
					version: 1,
					exportedAt: new Date().toISOString(),
					queries: queries.map(({ prompt, period, streamIds, applyToAll }) => ({ prompt, period, streamIds, applyToAll: Boolean(applyToAll) }))
				};
				const blobUrl = URL.createObjectURL(new Blob([JSON.stringify(fileContent, null, 2)], { type: "application/json" }));
				const download = document.createElement("a");
				download.href = blobUrl;
				const fileName = `aivision-queries-${appName}.json`;
				download.download = fileName;
				download.click();
				URL.revokeObjectURL(blobUrl);
				elements.queryFileName.textContent = fileName;
				elements.queryFileName.title = fileName;
				setStatus(`${fileContent.queries.length} query definition(s) saved to file`);
			}
			catch (error) {
				setStatus(error.message);
			}
		}

		function loadQueries() {
			elements.queryFileInput.value = "";
			elements.queryFileInput.click();
		}

		async function loadQueriesFromFile(event) {
			try {
				const file = event.target.files?.[0];
				if (!file) return;
				elements.queryFileName.textContent = file.name;
				elements.queryFileName.title = file.name;
				const content = JSON.parse(await file.text());
				const saved = content?.queries;
				if (!Array.isArray(saved) || saved.length === 0) {
					throw new Error("The selected file has no query definitions");
				}
				let loaded = 0;
				for (const query of saved) {
					if (typeof query.prompt !== "string" || !query.prompt.trim() || !Number.isFinite(Number(query.period)) || !Array.isArray(query.streamIds)) {
						throw new Error("Invalid query definition file");
					}
					const response = await request("/periodic", {
						method: "POST",
						body: JSON.stringify({ prompt: query.prompt, period: query.period, streamIds: query.streamIds, applyToAll: Boolean(query.applyToAll) })
					});
					if (response.success) {
						periodicResultIds.set(response.dataId, 0);
						loaded++;
					}
				}
				await loadActiveQueries();
				setStatus(`${loaded} query definition(s) loaded from file`);
			}
			catch (error) {
				setStatus(error.message);
			}
		}

		function editQuery(group) {
			elements.prompt.value = group.prompt;
			elements.period.value = group.period;
			elements.continuousToggle.checked = true;
			updateContinuousMode();
			selectedApplyStreams = group.applyToAll ? new Set() : new Set(group.streams);
			editingRequestId = group.requestId;
			renderApplyToOptions();
			elements.analyzeButton.textContent = "Update Query";
			elements.prompt.focus();
		}

		async function deleteQueryGroup(requestId) {
			try {
				await request(`/periodic/${encodeURIComponent(requestId)}`, { method: "DELETE" });
				periodicResultIds.delete(requestId);
				setStatus("Prompt query deleted");
				await loadActiveQueries();
			}
			catch (error) {
				setStatus(error.message);
			}
		}

		async function loadActiveStreams(autoPlayFirst = false) {
			try {
				const response = await fetch(`${broadcastsBase}/list/0/50?sort_by=date&order_by=desc`);
				if (!response.ok) {
					throw new Error(`Could not load streams: HTTP ${response.status}`);
				}
				const broadcasts = await response.json();
				activeStreams = (Array.isArray(broadcasts) ? broadcasts : [])
						.filter((broadcast) => broadcast.status === "broadcasting")
						.map((broadcast) => ({
							streamId: broadcast.streamId,
							name: broadcast.name || broadcast.streamId
						}));
				renderApplyToOptions();

				const previousSelection = elements.activeStreamSelect.value || connectedStreamId;
				elements.activeStreamSelect.textContent = "";
				if (activeStreams.length === 0) {
					const option = document.createElement("option");
					option.value = "";
					option.textContent = "No active stream";
					elements.activeStreamSelect.appendChild(option);
					if (connectedStreamId) {
						await disconnectPlayer();
					}
					return;
				}

				for (const stream of activeStreams) {
					const option = document.createElement("option");
					option.value = stream.streamId;
					option.textContent = stream.name === stream.streamId
							? stream.streamId : `${stream.name} (${stream.streamId})`;
					elements.activeStreamSelect.appendChild(option);
				}

				const selectedStream = activeStreams.some((stream) => stream.streamId === previousSelection)
						? previousSelection : activeStreams[0].streamId;
				const shouldSwitchPlayer = Boolean(connectedStreamId && connectedStreamId !== selectedStream);
				elements.activeStreamSelect.value = selectedStream;
				selectStream(selectedStream);
				if (shouldSwitchPlayer) {
					await playSelectedStream();
				}
				else if (autoPlayFirst && connectionState === "disconnected") {
					await connectPlayer();
				}
			}
			catch (error) {
				setStatus(error.message);
			}
		}

		function renderApplyToOptions() {
			const availableIds = new Set(activeStreams.map((stream) => stream.streamId));
			selectedApplyStreams = new Set([...selectedApplyStreams].filter((id) => availableIds.has(id)));
			elements.applyToOptions.textContent = "";

			const allLabel = document.createElement("label");
			const allCheckbox = document.createElement("input");
			allCheckbox.type = "checkbox";
			allCheckbox.checked = selectedApplyStreams.size === 0;
			allCheckbox.addEventListener("change", () => {
				selectedApplyStreams.clear();
				renderApplyToOptions();
			});
			allLabel.append(allCheckbox, document.createTextNode("All active streams"));
			elements.applyToOptions.appendChild(allLabel);

			for (const stream of activeStreams) {
				const label = document.createElement("label");
				const checkbox = document.createElement("input");
				checkbox.type = "checkbox";
				checkbox.checked = selectedApplyStreams.has(stream.streamId);
				checkbox.addEventListener("change", () => {
					if (checkbox.checked) {
						selectedApplyStreams.add(stream.streamId);
					}
					else {
						selectedApplyStreams.delete(stream.streamId);
					}
					renderApplyToOptions();
				});
				label.append(checkbox, document.createTextNode(stream.name === stream.streamId
						? stream.streamId : `${stream.name} (${stream.streamId})`));
				elements.applyToOptions.appendChild(label);
			}

			elements.applyToLabel.textContent = selectedApplyStreams.size === 0
					? "All" : `${selectedApplyStreams.size} stream${selectedApplyStreams.size === 1 ? "" : "s"}`;
		}

		function targetStreamIds() {
			return selectedApplyStreams.size === 0
					? activeStreams.map((stream) => stream.streamId)
					: [...selectedApplyStreams];
		}

		function selectStream(selectedStreamId) {
			if (!selectedStreamId) {
				return;
			}
			elements.activeStreamSelect.value = selectedStreamId;
			updateStreamBadge();
		}

		async function playSelectedStream() {
			const selectedStreamId = elements.activeStreamSelect.value;
			if (!selectedStreamId || selectedStreamId === connectedStreamId) {
				return;
			}
			if (connectionState !== "disconnected") {
				await disconnectPlayer();
			}
			selectStream(selectedStreamId);
			await connectPlayer();
		}

		async function disconnectPlayer() {
			if (webRTCAdaptor) {
				try {
					webRTCAdaptor.stop(connectedStreamId || streamId());
					webRTCAdaptor.closeWebSocket();
				}
				catch (error) {
					setStatus(String(error));
				}
				webRTCAdaptor = null;
			}
			connectedStreamId = "";
			setConnectionState("disconnected");
			setStatus("Disconnected");
		}

		async function connectPlayer() {
			if (!streamId()) {
				setStatus("Stream ID is required");
				return;
			}

			const targetStreamId = streamId();
			updateStreamBadge();
			setConnectionState("connecting");
			if (webRTCAdaptor) {
				webRTCAdaptor.stop(connectedStreamId || targetStreamId);
				webRTCAdaptor.closeWebSocket();
			}

			connectedStreamId = targetStreamId;
			webRTCAdaptor = new WebRTCAdaptor({
				websocket_url: `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/${appName}/websocket`,
				remoteVideoId: "remoteVideo",
				isPlayMode: true,
				callback: (info) => {
					if (info === "initialized") {
						webRTCAdaptor.play(targetStreamId);
						setStatus("Connecting");
					}
					if (info === "play_started") {
						setConnectionState("connected");
						setStatus("Connected");
					}
					if (info === "play_finished") {
						setConnectionState("disconnected");
						setStatus("Playback finished");
					}
				},
				callbackError: (error) => {
					setConnectionState("disconnected");
					setStatus(String(error));
				}
			});
		}

		async function analyze() {
			if (isAnalyzing) {
				return;
			}
			isAnalyzing = true;
			elements.analyzeButton.disabled = true;
			try {
				const targets = targetStreamIds();
				const applyToAll = selectedApplyStreams.size === 0;
				if (targets.length === 0 && !elements.continuousToggle.checked) {
					throw new Error("No active stream is available");
				}
				elements.applyTo.open = false;
				if (elements.continuousToggle.checked) {
					if (editingRequestId) {
						await request(`/periodic/${encodeURIComponent(editingRequestId)}`, { method: "DELETE" });
						periodicResultIds.delete(editingRequestId);
					}
					const response = await request("/periodic", {
						method: "POST",
						body: JSON.stringify({ prompt: elements.prompt.value, period: Number(elements.period.value), streamIds: targets, applyToAll })
					});
					if (!response.success) {
						throw new Error(response.message || "Periodic analysis could not be started");
					}
					periodicResultIds.set(response.dataId, 0);
					editingRequestId = null;
					elements.analyzeButton.textContent = "Analyze";
					setStatus(applyToAll ? "Periodic analysis started for all streams" : `Periodic analysis started for ${targets.length} stream(s)`);
					await loadActiveQueries();
					return;
				}

				const results = [];
				for (const target of targets) {
					const body = await request("/analyze", {
						method: "POST",
						body: JSON.stringify({ streamId: target, prompt: elements.prompt.value, lastFrameTimestamp: 0 })
					});
					results.push(addResult(body));
				}
				openOneShotResults(results);
				setStatus(`Analysis completed for ${targets.length} stream(s)`);
			}
			catch (error) {
				setStatus(error.message);
			}
			finally {
				isAnalyzing = false;
				elements.analyzeButton.disabled = false;
			}
		}

		async function pollPeriodicResults() {
			try {
				const queries = await request("/periodic");
				for (const query of queries) {
					const after = periodicResultIds.get(query.requestId) || 0;
					const newResults = await request(`/periodic/${encodeURIComponent(query.requestId)}/results?after=${after}`);
					for (const result of newResults) {
						periodicResultIds.set(query.requestId, Math.max(periodicResultIds.get(query.requestId) || 0, result.resultId || 0));
						addResult(result);
					}
				}
			}
			catch (error) {
				setStatus(error.message);
			}
		}

		async function saveSettings() {
			elements.saveSettingsButton.disabled = true;
			try {
				const body = await request("/settings", {
					method: "POST",
					body: JSON.stringify({
						baseUrl: elements.baseUrl.value,
						token: elements.token.value,
						model: elements.model.value,
						webhookUrl: elements.webhookUrl.value,
						maxResultsPerAnalysis: Number(elements.maxResultsPerAnalysis.value)
					})
				});
				setStatus(`AI settings saved: ${body.baseUrl} / ${body.model}`);
			}
			catch (error) {
				setStatus(error.message);
			}
			finally {
				elements.saveSettingsButton.disabled = false;
			}
		}

		async function loadSettings() {
			try {
				const body = await request("/settings");
				elements.baseUrl.value = body.baseUrl || "";
				elements.token.value = body.token || "";
				elements.model.value = body.model || "";
				elements.webhookUrl.value = body.webhookUrl || "";
				elements.maxResultsPerAnalysis.value = body.maxResultsPerAnalysis || 100;
				return true;
			}
			catch (error) {
				setStatus(error.message);
				return false;
			}
		}

		async function resetSettings() {
			elements.resetSettingsButton.disabled = true;
			try {
				if (await loadSettings()) {
					setStatus("Unsaved changes discarded; settings reloaded from server");
				}
			}
			finally {
				elements.resetSettingsButton.disabled = false;
			}
		}

		elements.analyzeButton.addEventListener("click", analyze);
		elements.continuousToggle.addEventListener("change", () => {
			updateContinuousMode();
		});
		elements.activeStreamSelect.addEventListener("change", playSelectedStream);
		elements.saveSettingsButton.addEventListener("click", saveSettings);
		elements.resetSettingsButton.addEventListener("click", resetSettings);
		elements.saveQueriesButton.addEventListener("click", saveQueries);
		elements.loadQueriesButton.addEventListener("click", loadQueries);
		elements.queryFileInput.addEventListener("change", loadQueriesFromFile);
		elements.resultModalClose.addEventListener("click", closeResultModal);
		elements.resultModalBackdrop.addEventListener("click", (event) => {
			if (event.target === elements.resultModalBackdrop) {
				closeResultModal();
			}
		});
		document.addEventListener("keydown", (event) => {
			if (event.key === "Escape" && elements.resultModalBackdrop.classList.contains("is-open")) {
				closeResultModal();
			}
		});
		async function initialize() {
			updateContinuousMode();
			await loadSettings();
			await loadActiveStreams(true);
			await loadActiveQueries();
			streamListTimer = setInterval(() => loadActiveStreams(false), 5000);
			queryListTimer = setInterval(loadActiveQueries, 3000);
			resultPollTimer = setInterval(pollPeriodicResults, 1000);
		}

		initialize();
	</script>
</body>
</html>
