<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>AI Vision</title>
	<style>
		:root {
			color-scheme: dark;
			font-family: Inter, Arial, Helvetica, sans-serif;
			background: #090d14;
			color: #f5f7fb;
			--ant-red: #e31e24;
			--bg: #090d14;
			--panel: #111827;
			--panel-soft: #141d2b;
			--panel-deep: #0c111d;
			--line: #263348;
			--text: #f5f7fb;
			--muted: #98a2b3;
			--muted-strong: #cbd5e1;
			--danger-soft: rgba(227, 30, 36, 0.16);
			--danger-line: rgba(227, 30, 36, 0.42);
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			background:
				radial-gradient(circle at 18% 0%, rgba(227, 30, 36, 0.18), transparent 32%),
				linear-gradient(180deg, #111827 0%, var(--bg) 42%);
		}

		button,
		input,
		textarea {
			font: inherit;
		}

		.app {
			display: grid;
			grid-template-rows: auto minmax(0, 1fr);
			gap: 16px;
			width: min(100%, 1600px);
			height: 100vh;
			min-height: 720px;
			margin: 0 auto;
			padding: 16px;
		}

		.topbar,
		.panel,
		.stage,
		.results-panel {
			border: 1px solid var(--line);
			border-radius: 8px;
			background: rgba(17, 24, 39, 0.9);
			box-shadow: 0 18px 42px rgba(0, 0, 0, 0.28);
		}

		.topbar {
			display: grid;
			grid-template-columns: minmax(180px, 1fr) auto minmax(180px, 1fr);
			align-items: center;
			gap: 24px;
			padding: 12px 14px;
		}

		.brand {
			display: flex;
			align-items: center;
			min-width: 0;
		}

		.topbar-title {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 12px;
			min-width: 0;
			text-align: center;
		}

		.brand-logo {
			display: block;
			width: 168px;
			height: auto;
			max-height: 38px;
		}

		.brand-name {
			color: var(--muted-strong);
			font-size: 13px;
			font-weight: 800;
			line-height: 1;
		}

		h1,
		h2 {
			margin: 0;
		}

		h1 {
			font-size: 28px;
			line-height: 1.1;
		}

		.title-divider {
			color: var(--ant-red);
			font-size: 22px;
			font-weight: 900;
		}

		.live-state {
			display: none;
			align-items: center;
			justify-self: end;
			gap: 8px;
			max-width: 420px;
			border: 1px solid var(--line);
			border-radius: 999px;
			background: var(--panel-deep);
			color: var(--muted-strong);
			padding: 8px 12px;
			font-size: 13px;
			font-weight: 800;
		}

		.live-dot {
			width: 9px;
			height: 9px;
			border-radius: 999px;
			background: #667085;
			flex: 0 0 auto;
		}

		.app.alert-active .live-state {
			display: flex;
			border-color: var(--danger-line);
			background: var(--danger-soft);
			color: #fecaca;
			animation: alertPulse 1s ease-in-out infinite;
		}

		.app.alert-active .live-dot {
			background: var(--ant-red);
			box-shadow: 0 0 0 6px rgba(227, 30, 36, 0.15);
		}

		@keyframes alertPulse {
			0%, 100% {
				opacity: 1;
			}
			50% {
				opacity: 0.45;
			}
		}

		.layout {
			display: grid;
			grid-template-columns: minmax(300px, 340px) minmax(460px, 1fr) minmax(360px, 420px);
			gap: 16px;
			align-items: stretch;
			min-height: 0;
		}

		.panel,
		.stage,
		.results-panel {
			display: grid;
			gap: 14px;
			padding: 14px;
			min-height: 0;
		}

		.panel {
			align-content: start;
		}

		.stage {
			grid-template-rows: auto minmax(0, auto);
			align-content: start;
		}

		.results-panel {
			grid-template-rows: auto minmax(0, 1fr);
			overflow: hidden;
		}

		.panel-title {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 10px;
			color: var(--text);
			font-size: 12px;
			font-weight: 900;
			letter-spacing: 0.04em;
			text-transform: uppercase;
		}

		.counter {
			border: 1px solid var(--line);
			border-radius: 999px;
			background: var(--panel-deep);
			color: var(--muted-strong);
			padding: 4px 8px;
			font-size: 12px;
		}

		.form-grid {
			display: grid;
			gap: 14px;
		}

		.field-group {
			display: grid;
			gap: 12px;
			border-top: 1px solid var(--line);
			padding-top: 14px;
		}

		.field-group:first-child {
			border-top: 0;
			padding-top: 0;
		}

		.group-title {
			color: #e2e8f0;
			font-size: 12px;
			font-weight: 900;
			letter-spacing: 0.04em;
			text-transform: uppercase;
		}

		label {
			display: grid;
			gap: 7px;
			color: var(--muted-strong);
			font-size: 13px;
			font-weight: 800;
		}

		input,
		textarea {
			width: 100%;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--panel-deep);
			color: var(--text);
			padding: 10px 11px;
			outline: none;
			transition: border-color 0.16s ease, box-shadow 0.16s ease;
		}

		input:focus,
		textarea:focus {
			border-color: rgba(227, 30, 36, 0.7);
			box-shadow: 0 0 0 4px rgba(227, 30, 36, 0.14);
		}

		textarea {
			min-height: 132px;
			resize: vertical;
			line-height: 1.45;
		}

		.actions {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 10px;
		}

		.stream-row {
			display: grid;
			grid-template-columns: minmax(0, 1fr) 138px;
			gap: 10px;
			align-items: end;
		}

		button {
			min-height: 42px;
			border: 1px solid transparent;
			border-radius: 8px;
			background: var(--ant-red);
			color: #ffffff;
			cursor: pointer;
			font-weight: 900;
			padding: 10px 12px;
			transition: transform 0.14s ease, box-shadow 0.14s ease, opacity 0.14s ease;
		}

		button:hover {
			transform: translateY(-1px);
			box-shadow: 0 10px 22px rgba(227, 30, 36, 0.22);
		}

		button.secondary {
			border-color: var(--line);
			background: #1b2536;
			color: var(--text);
		}

		button.secondary:hover {
			box-shadow: 0 10px 22px rgba(0, 0, 0, 0.18);
		}

		.connection-button {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			background: #1b2536;
			border-color: var(--line);
			color: var(--text);
			white-space: nowrap;
		}

		.connection-button.is-connected {
			background: rgba(18, 183, 106, 0.16);
			border-color: rgba(18, 183, 106, 0.45);
			color: #bbf7d0;
		}

		.connection-button.is-connecting {
			background: rgba(227, 30, 36, 0.14);
			border-color: rgba(227, 30, 36, 0.45);
			color: #fecaca;
		}

		.connection-dot {
			width: 9px;
			height: 9px;
			border-radius: 999px;
			background: #64748b;
			flex: 0 0 auto;
		}

		.connection-button.is-connected .connection-dot {
			background: #22c55e;
			box-shadow: 0 0 0 5px rgba(34, 197, 94, 0.14);
		}

		.connection-button.is-connecting .connection-dot {
			background: var(--ant-red);
			box-shadow: 0 0 0 5px rgba(227, 30, 36, 0.14);
		}

		button:disabled {
			cursor: wait;
			opacity: 0.62;
			transform: none;
			box-shadow: none;
		}

		.status {
			min-height: 42px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--panel-deep);
			color: var(--muted-strong);
			padding: 11px;
			font-size: 13px;
			font-weight: 800;
			line-height: 1.35;
			overflow-wrap: anywhere;
		}

		.player-shell {
			position: relative;
			overflow: hidden;
			border: 1px solid #334155;
			border-radius: 8px;
			background: #030712;
			aspect-ratio: 16 / 9;
			min-height: 260px;
			max-height: 540px;
		}

		.app.alert-active .player-shell {
			border-color: var(--ant-red);
			box-shadow: 0 0 0 4px rgba(227, 30, 36, 0.15);
		}

		video {
			display: block;
			width: 100%;
			height: 100%;
			background: #030712;
			object-fit: contain;
		}

		.stream-badge {
			position: absolute;
			left: 12px;
			top: 12px;
			border: 1px solid rgba(255, 255, 255, 0.14);
			border-radius: 999px;
			background: rgba(3, 7, 18, 0.78);
			color: #ffffff;
			padding: 7px 10px;
			font-size: 12px;
			font-weight: 900;
		}

		.prompt-panel {
			display: grid;
			gap: 12px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--panel-soft);
			padding: 14px;
		}

		.analysis-actions {
			display: grid;
			grid-template-columns: minmax(180px, 1fr) auto;
			gap: 12px;
			align-items: center;
		}

		.switch-control {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			min-height: 42px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--panel-deep);
			padding: 8px 10px;
			color: var(--muted-strong);
			cursor: pointer;
			user-select: none;
		}

		.switch-label {
			font-size: 13px;
			font-weight: 900;
		}

		.switch-control input {
			position: absolute;
			opacity: 0;
			pointer-events: none;
		}

		.switch-track {
			position: relative;
			width: 42px;
			height: 24px;
			border-radius: 999px;
			background: #334155;
			flex: 0 0 auto;
			transition: background 0.16s ease;
		}

		.switch-track::after {
			content: "";
			position: absolute;
			left: 3px;
			top: 3px;
			width: 18px;
			height: 18px;
			border-radius: 999px;
			background: #ffffff;
			transition: transform 0.16s ease;
		}

		.switch-control input:checked + .switch-track {
			background: var(--ant-red);
		}

		.switch-control input:checked + .switch-track::after {
			transform: translateX(18px);
		}

		.results-list {
			display: grid;
			gap: 10px;
			align-content: start;
			min-height: 0;
			overflow: auto;
			padding-right: 2px;
		}

		.empty-results {
			border: 1px dashed #334155;
			border-radius: 8px;
			background: var(--panel-deep);
			color: var(--muted);
			padding: 22px 14px;
			font-size: 13px;
			text-align: center;
		}

		.result-item {
			display: grid;
			grid-template-columns: 92px minmax(0, 1fr);
			gap: 12px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--panel-soft);
			padding: 12px;
			cursor: pointer;
			text-align: left;
			transition: border-color 0.16s ease, transform 0.16s ease, background 0.16s ease;
		}

		.result-item:hover,
		.result-item:focus-visible {
			border-color: #475569;
			background: #182235;
			transform: translateY(-1px);
			outline: none;
		}

		.result-item.is-alert {
			border-color: var(--danger-line);
			background: var(--danger-soft);
		}

		.result-thumb {
			width: 92px;
			aspect-ratio: 16 / 10;
			border: 1px solid var(--line);
			border-radius: 6px;
			background: #020617;
			object-fit: cover;
		}

		.result-placeholder {
			display: grid;
			place-items: center;
			color: var(--muted);
			font-size: 11px;
		}

		.result-body {
			display: grid;
			gap: 6px;
			min-width: 0;
		}

		.result-head {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 8px;
			min-width: 0;
		}

		.result-title {
			display: flex;
			align-items: center;
			gap: 7px;
			min-width: 0;
			color: var(--text);
			font-size: 13px;
			font-weight: 900;
		}

		.result-title span {
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.result-time {
			color: var(--muted);
			font-size: 12px;
			font-weight: 800;
			white-space: nowrap;
		}

		.result-text {
			display: -webkit-box;
			-webkit-box-orient: vertical;
			-webkit-line-clamp: 4;
			overflow: hidden;
			color: var(--muted-strong);
			font-size: 13px;
			line-height: 1.45;
			overflow-wrap: anywhere;
		}

		.bell-icon {
			width: 16px;
			height: 16px;
			color: #fca5a5;
			flex: 0 0 auto;
		}

		.modal-backdrop {
			position: fixed;
			inset: 0;
			z-index: 50;
			display: none;
			align-items: center;
			justify-content: center;
			background: rgba(2, 6, 23, 0.78);
			padding: 22px;
		}

		.modal-backdrop.is-open {
			display: flex;
		}

		.result-modal {
			display: grid;
			grid-template-rows: auto minmax(0, 1fr);
			width: min(920px, 100%);
			max-height: min(760px, calc(100vh - 44px));
			border: 1px solid var(--line);
			border-radius: 8px;
			background: #0f172a;
			box-shadow: 0 30px 90px rgba(0, 0, 0, 0.46);
			overflow: hidden;
		}

		.modal-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			border-bottom: 1px solid var(--line);
			padding: 14px 16px;
		}

		.modal-title {
			display: flex;
			align-items: center;
			gap: 8px;
			min-width: 0;
			color: var(--text);
			font-size: 16px;
			font-weight: 900;
		}

		.modal-close {
			display: grid;
			place-items: center;
			width: 34px;
			height: 34px;
			min-height: 34px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: #111827;
			color: var(--muted-strong);
			padding: 0;
		}

		.modal-close:hover {
			box-shadow: none;
		}

		.modal-content {
			display: grid;
			grid-template-columns: minmax(260px, 42%) minmax(0, 1fr);
			gap: 16px;
			min-height: 0;
			overflow: auto;
			padding: 16px;
		}

		.modal-image {
			width: 100%;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: #020617;
			object-fit: contain;
		}

		.modal-placeholder {
			display: grid;
			place-items: center;
			min-height: 180px;
			border: 1px dashed #334155;
			border-radius: 8px;
			background: #020617;
			color: var(--muted);
			font-size: 13px;
		}

		.detail-stack {
			display: grid;
			gap: 12px;
			align-content: start;
		}

		.detail-block {
			display: grid;
			gap: 7px;
		}

		.detail-label {
			color: var(--muted);
			font-size: 11px;
			font-weight: 900;
			letter-spacing: 0.05em;
			text-transform: uppercase;
		}

		.detail-value {
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--panel-deep);
			color: var(--muted-strong);
			padding: 10px;
			font-size: 13px;
			line-height: 1.5;
			white-space: pre-wrap;
			overflow-wrap: anywhere;
		}

		.detail-value.primary {
			color: var(--text);
			font-size: 14px;
		}

		@media (max-width: 1180px) {
			.app {
				height: auto;
				min-height: 100vh;
			}

			.layout {
				grid-template-columns: minmax(280px, 330px) minmax(420px, 1fr);
			}

			.results-panel {
				grid-column: 1 / -1;
				min-height: 420px;
			}
		}

		@media (max-width: 820px) {
			.layout {
				grid-template-columns: 1fr;
			}

			.panel {
				min-height: auto;
			}
		}

		@media (max-width: 640px) {
			.app {
				padding: 12px;
			}

			.topbar {
				align-items: flex-start;
				grid-template-columns: 1fr;
			}

			.brand {
				align-items: flex-start;
				flex-direction: column;
				gap: 8px;
			}

			.topbar-title {
				align-items: flex-start;
				justify-content: flex-start;
				text-align: left;
			}

			.live-state {
				width: 100%;
				max-width: none;
			}

			.actions {
				grid-template-columns: 1fr;
			}

			.stream-row {
				grid-template-columns: 1fr;
			}

			.analysis-actions {
				grid-template-columns: 1fr;
			}

			.player-shell {
				min-height: 210px;
			}

			.modal-content {
				grid-template-columns: 1fr;
			}
		}
	</style>
</head>
<body>
	<main id="app" class="app">
		<header class="topbar">
			<div class="brand">
				<img class="brand-logo" src="https://antmedia.io/wp-content/uploads/2020/01/Ant-Media-Logo-light.svg" alt="Ant Media">
			</div>
			<div class="topbar-title">
				<h1>AI Vision</h1>
				<span class="title-divider">-</span>
				<div class="brand-name">Live Stream AI Analysis</div>
			</div>
			<div id="statusPill" class="live-state">
				<span class="live-dot"></span>
				<span id="statusText">Idle</span>
			</div>
		</header>

		<div class="layout">
			<aside class="panel">
				<div class="panel-title">
					<span>Stream Controls</span>
				</div>
				<div class="form-grid">
					<div class="field-group">
						<div class="group-title">Playback</div>
						<div class="stream-row">
							<label>
								Stream ID
								<input id="streamId" value="stream1" autocomplete="off">
							</label>
							<button id="connectButton" class="connection-button" type="button">
								<span class="connection-dot"></span>
								<span id="connectButtonText">Connect</span>
							</button>
						</div>
					</div>

					<div class="field-group">
						<div class="group-title">Vision Model</div>
						<label>
							Base URL
							<input id="baseUrl" value="http://localhost:11434/v1" autocomplete="off">
						</label>

						<label>
							Token
							<input id="token" type="password" autocomplete="off">
						</label>

						<label>
							Model
							<input id="model" value="llava" autocomplete="off">
						</label>

						<button id="saveSettingsButton" class="secondary" type="button">Save Settings</button>
					</div>

					<div class="field-group">
						<div class="group-title">Status</div>
						<div id="status" class="status">Idle</div>
					</div>
				</div>
			</aside>

			<section class="stage">
				<div class="player-shell">
					<video id="remoteVideo" autoplay playsinline controls muted></video>
					<div id="streamBadge" class="stream-badge">stream1</div>
				</div>

				<section class="prompt-panel">
					<label>
						Prompt
						<textarea id="prompt">Is there a person in this live stream frame?</textarea>
					</label>
					<div class="analysis-actions">
						<button id="analyzeButton" type="button">Analyze</button>
						<label class="switch-control">
							<span class="switch-label">Continuous</span>
							<input id="continuousToggle" type="checkbox">
							<span class="switch-track"></span>
						</label>
					</div>
				</section>
			</section>

			<aside class="results-panel">
				<div class="panel-title">
					<span>Analysis Results</span>
					<span id="resultCount" class="counter">0</span>
				</div>
				<div id="resultsList" class="results-list">
					<div class="empty-results">No analysis result yet.</div>
				</div>
			</aside>
		</div>
	</main>

	<div id="resultModalBackdrop" class="modal-backdrop" aria-hidden="true">
		<section class="result-modal" role="dialog" aria-modal="true" aria-labelledby="resultModalTitle">
			<header class="modal-header">
				<div id="resultModalTitle" class="modal-title"></div>
				<button id="resultModalClose" class="modal-close" type="button" aria-label="Close">x</button>
			</header>
			<div id="resultModalContent" class="modal-content"></div>
		</section>
	</div>

	<script type="module">
		import {WebRTCAdaptor} from "./js/webrtc_adaptor.js";

		const appName = location.pathname.split("/").filter(Boolean)[0] || "LiveApp";
		const restBase = `${location.origin}/${appName}/rest/v2/aivision`;
		let webRTCAdaptor;
		let continuousTimer;
		let isAnalyzing = false;
		let lastAnalyzedImageUrl = "";
		let lastAnalyzedFrameTimestamp = 0;
		let connectionState = "disconnected";
		let connectedStreamId = "";
		const results = [];
		const continuousIntervalMs = 0;

		const elements = {
			app: document.getElementById("app"),
			streamId: document.getElementById("streamId"),
			prompt: document.getElementById("prompt"),
			baseUrl: document.getElementById("baseUrl"),
			token: document.getElementById("token"),
			model: document.getElementById("model"),
			status: document.getElementById("status"),
			statusText: document.getElementById("statusText"),
			resultsList: document.getElementById("resultsList"),
			resultCount: document.getElementById("resultCount"),
			resultModalBackdrop: document.getElementById("resultModalBackdrop"),
			resultModalTitle: document.getElementById("resultModalTitle"),
			resultModalContent: document.getElementById("resultModalContent"),
			resultModalClose: document.getElementById("resultModalClose"),
			streamBadge: document.getElementById("streamBadge"),
			connectButton: document.getElementById("connectButton"),
			connectButtonText: document.getElementById("connectButtonText"),
			analyzeButton: document.getElementById("analyzeButton"),
			continuousToggle: document.getElementById("continuousToggle"),
			saveSettingsButton: document.getElementById("saveSettingsButton")
		};

		function setStatus(message) {
			elements.status.textContent = message;
		}

		function streamId() {
			return elements.streamId.value.trim();
		}

		function updateStreamBadge() {
			elements.streamBadge.textContent = streamId() || "No stream";
			lastAnalyzedImageUrl = "";
			lastAnalyzedFrameTimestamp = 0;
		}

		function setConnectionState(state) {
			connectionState = state;
			elements.connectButton.classList.toggle("is-connected", state === "connected");
			elements.connectButton.classList.toggle("is-connecting", state === "connecting");
			elements.streamId.disabled = state !== "disconnected";
			elements.connectButton.disabled = state === "connecting";
			elements.connectButtonText.textContent = state === "connected" ? "Disconnect" : state === "connecting" ? "Connecting" : "Connect";
		}

		function bellIcon() {
			const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
			svg.setAttribute("class", "bell-icon");
			svg.setAttribute("viewBox", "0 0 24 24");
			svg.setAttribute("fill", "none");
			svg.setAttribute("stroke", "currentColor");
			svg.setAttribute("stroke-width", "2");
			svg.setAttribute("stroke-linecap", "round");
			svg.setAttribute("stroke-linejoin", "round");

			const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
			path.setAttribute("d", "M10.268 21a2 2 0 0 0 3.464 0");
			const path2 = document.createElementNS("http://www.w3.org/2000/svg", "path");
			path2.setAttribute("d", "M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8a6 6 0 0 0-12 0c0 4.499-1.411 5.956-2.738 7.326");
			svg.append(path, path2);
			return svg;
		}

		function detailBlock(label, value, primary = false) {
			const block = document.createElement("div");
			block.className = "detail-block";

			const title = document.createElement("div");
			title.className = "detail-label";
			title.textContent = label;

			const content = document.createElement("div");
			content.className = `detail-value${primary ? " primary" : ""}`;
			content.textContent = value || "-";

			block.append(title, content);
			return block;
		}

		function closeResultModal() {
			elements.resultModalBackdrop.classList.remove("is-open");
			elements.resultModalBackdrop.setAttribute("aria-hidden", "true");
			elements.resultModalTitle.textContent = "";
			elements.resultModalContent.textContent = "";
		}

		function openResultModal(result) {
			elements.resultModalTitle.textContent = "";
			if (result.alertTriggered) {
				elements.resultModalTitle.appendChild(bellIcon());
			}
			const titleText = document.createElement("span");
			titleText.textContent = result.alertTriggered ? "Alert Analysis Detail" : "Analysis Detail";
			elements.resultModalTitle.appendChild(titleText);

			elements.resultModalContent.textContent = "";
			if (result.imageUrl) {
				const image = document.createElement("img");
				image.className = "modal-image";
				image.src = result.imageUrl;
				image.alt = "Analyzed frame";
				elements.resultModalContent.appendChild(image);
			}
			else {
				const placeholder = document.createElement("div");
				placeholder.className = "modal-placeholder";
				placeholder.textContent = "No image";
				elements.resultModalContent.appendChild(placeholder);
			}

			const details = document.createElement("div");
			details.className = "detail-stack";
			details.append(
				detailBlock("Stream", result.streamId),
				detailBlock("Time", result.time),
				detailBlock("Prompt", result.prompt),
				detailBlock("Alert", result.alertTriggered ? (result.alerts.join(", ") || "Triggered") : "No alert"),
				detailBlock("Response", result.aiResponse || result.message || "", true)
			);
			elements.resultModalContent.appendChild(details);
			elements.resultModalBackdrop.classList.add("is-open");
			elements.resultModalBackdrop.setAttribute("aria-hidden", "false");
			elements.resultModalClose.focus();
		}

		function renderResults() {
			elements.resultCount.textContent = String(results.length);
			const hasAlert = results.some((result) => result.alertTriggered);
			elements.app.classList.toggle("alert-active", hasAlert);
			elements.statusText.textContent = hasAlert ? "Alert" : "";

			if (results.length === 0) {
				elements.resultsList.innerHTML = '<div class="empty-results">No analysis result yet.</div>';
				return;
			}

			elements.resultsList.innerHTML = "";
			for (const result of results) {
				const item = document.createElement("article");
				item.className = `result-item${result.alertTriggered ? " is-alert" : ""}`;
				item.setAttribute("role", "button");
				item.setAttribute("tabindex", "0");
				item.setAttribute("aria-label", "Open analysis detail");
				item.addEventListener("click", () => openResultModal(result));
				item.addEventListener("keydown", (event) => {
					if (event.key === "Enter" || event.key === " ") {
						event.preventDefault();
						openResultModal(result);
					}
				});

				let thumb;
				if (result.imageUrl) {
					thumb = document.createElement("img");
					thumb.className = "result-thumb";
					thumb.src = result.imageUrl;
					thumb.alt = "Analyzed frame";
				}
				else {
					thumb = document.createElement("div");
					thumb.className = "result-thumb result-placeholder";
					thumb.textContent = "No image";
				}

				const body = document.createElement("div");
				body.className = "result-body";

				const head = document.createElement("div");
				head.className = "result-head";

				const title = document.createElement("div");
				title.className = "result-title";
				if (result.alertTriggered) {
					title.appendChild(bellIcon());
				}
				const titleText = document.createElement("span");
				titleText.textContent = result.alertTriggered ? (result.alerts.join(", ") || "Alert") : result.streamId;
				title.appendChild(titleText);

				const time = document.createElement("div");
				time.className = "result-time";
				time.textContent = result.time;

				const text = document.createElement("div");
				text.className = "result-text";
				text.textContent = result.aiResponse || result.message || "";

				head.append(title, time);
				body.append(head, text);
				item.append(thumb, body);
				elements.resultsList.appendChild(item);
			}
		}

		function addResult(body) {
			results.unshift({
				streamId: body.streamId || streamId(),
				prompt: body.prompt || elements.prompt.value,
				imageUrl: body.imageUrl,
				aiResponse: body.aiResponse,
				message: body.message,
				alertTriggered: Boolean(body.alertTriggered),
				alerts: Array.isArray(body.alerts) ? body.alerts : [],
				time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })
			});
			renderResults();
		}

		async function request(path, options = {}) {
			const response = await fetch(`${restBase}${path}`, {
				headers: { "Content-Type": "application/json", ...(options.headers || {}) },
				...options
			});
			const text = await response.text();
			const body = text ? JSON.parse(text) : {};
			if (!response.ok) {
				throw new Error(body.message || text || `HTTP ${response.status}`);
			}
			return body;
		}

		async function registerStream() {
			if (!streamId()) {
				throw new Error("Stream ID is required");
			}
			updateStreamBadge();
			const result = await request(`/register/${encodeURIComponent(streamId())}`, { method: "POST" });
			setStatus(result.message || "Stream registered");
		}

		async function unregisterStream(targetStreamId) {
			if (!targetStreamId) {
				return;
			}
			try {
				await request(`/register/${encodeURIComponent(targetStreamId)}`, { method: "DELETE" });
			}
			catch (error) {
				setStatus(error.message);
			}
		}

		async function disconnectPlayer() {
			clearTimeout(continuousTimer);
			elements.continuousToggle.checked = false;
			if (webRTCAdaptor) {
				try {
					webRTCAdaptor.stop(connectedStreamId || streamId());
					webRTCAdaptor.closeWebSocket();
				}
				catch (error) {
					setStatus(String(error));
				}
				webRTCAdaptor = null;
			}
			await unregisterStream(connectedStreamId || streamId());
			connectedStreamId = "";
			setConnectionState("disconnected");
			setStatus("Disconnected");
		}

		async function connectPlayer() {
			if (!streamId()) {
				setStatus("Stream ID is required");
				return;
			}

			const targetStreamId = streamId();
			updateStreamBadge();
			setConnectionState("connecting");
			try {
				await registerStream();
			}
			catch (error) {
				setConnectionState("disconnected");
				setStatus(error.message);
				return;
			}
			if (webRTCAdaptor) {
				webRTCAdaptor.stop(connectedStreamId || targetStreamId);
				webRTCAdaptor.closeWebSocket();
			}

			connectedStreamId = targetStreamId;
			webRTCAdaptor = new WebRTCAdaptor({
				websocket_url: `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/${appName}/websocket`,
				remoteVideoId: "remoteVideo",
				isPlayMode: true,
				callback: (info) => {
					if (info === "initialized") {
						webRTCAdaptor.play(targetStreamId);
						setStatus("Connecting");
					}
					if (info === "play_started") {
						setConnectionState("connected");
						setStatus("Connected");
					}
					if (info === "play_finished") {
						setConnectionState("disconnected");
						setStatus("Playback finished");
					}
				},
				callbackError: (error) => {
					setConnectionState("disconnected");
					setStatus(String(error));
				}
			});
		}

		function toggleConnection() {
			if (connectionState === "connected") {
				disconnectPlayer();
				return;
			}
			if (connectionState === "disconnected") {
				connectPlayer();
			}
		}

		async function analyze(options = {}) {
			if (isAnalyzing) {
				return;
			}
			isAnalyzing = true;
			elements.analyzeButton.disabled = true;
			try {
				const body = await request("/analyze", {
					method: "POST",
					body: JSON.stringify({
						streamId: streamId(),
						prompt: elements.prompt.value,
						lastImageUrl: lastAnalyzedImageUrl,
						lastFrameTimestamp: lastAnalyzedFrameTimestamp
					})
				});
				if (body.imageUrl) {
					lastAnalyzedImageUrl = body.imageUrl;
				}
				if (body.frameTimestamp) {
					lastAnalyzedFrameTimestamp = body.frameTimestamp;
				}
				if (!body.success) {
					setStatus(body.message || "Analysis failed");
					return;
				}
				addResult(body);
				setStatus(body.alertTriggered ? "Alert received" : "Analysis completed");
			}
			catch (error) {
				setStatus(error.message);
			}
			finally {
				isAnalyzing = false;
				elements.analyzeButton.disabled = false;
				if (options.continuous && elements.continuousToggle.checked) {
					scheduleContinuousAnalysis();
				}
			}
		}

		function scheduleContinuousAnalysis() {
			clearTimeout(continuousTimer);
			continuousTimer = setTimeout(() => analyze({ continuous: true }), continuousIntervalMs);
		}

		function setContinuousAnalysis(enabled) {
			clearTimeout(continuousTimer);
			if (enabled) {
				setStatus("Continuous analysis started");
				analyze({ continuous: true });
				return;
			}
			setStatus("Continuous analysis stopped");
		}

		async function saveSettings() {
			elements.saveSettingsButton.disabled = true;
			try {
				const body = await request("/settings", {
					method: "POST",
					body: JSON.stringify({
						baseUrl: elements.baseUrl.value,
						token: elements.token.value,
						model: elements.model.value
					})
				});
				setStatus(`AI settings saved: ${body.baseUrl} / ${body.model}`);
			}
			catch (error) {
				setStatus(error.message);
			}
			finally {
				elements.saveSettingsButton.disabled = false;
			}
		}

		elements.streamId.addEventListener("input", updateStreamBadge);
		elements.connectButton.addEventListener("click", toggleConnection);
		elements.analyzeButton.addEventListener("click", analyze);
		elements.continuousToggle.addEventListener("change", () => setContinuousAnalysis(elements.continuousToggle.checked));
		elements.saveSettingsButton.addEventListener("click", saveSettings);
		elements.resultModalClose.addEventListener("click", closeResultModal);
		elements.resultModalBackdrop.addEventListener("click", (event) => {
			if (event.target === elements.resultModalBackdrop) {
				closeResultModal();
			}
		});
		document.addEventListener("keydown", (event) => {
			if (event.key === "Escape" && elements.resultModalBackdrop.classList.contains("is-open")) {
				closeResultModal();
			}
		});
		renderResults();
	</script>
</body>
</html>
